name: CI

# Forgejo-only slim copy of .github/workflows/test.yml (hub#1029). The upstream file is a
# 5000+ line monorepo CI matrix covering dozens of integrations, several needing secrets this
# runner does not have (GCP/Vertex, etc). Once this file exists, Forgejo reads ONLY
# .forgejo/workflows/ and ignores .github/workflows/ entirely (see
# wiki-vault/wiki/gotchas -- ".forgejo/workflows/ SHADOWS .github/workflows/"), so this carries
# just the one job relevant to changes made on this fork's release branches: the core Python
# package build/smoke-test that covers hindsight-api-slim, which is what the determinism fixes
# touch, plus a fork-only strict clippy job for the Rust crates (see `clippy:` below).
# Everything else in the upstream file runs on GitHub only, unaffected by this.
#
# No dorny/paths-filter here: it is not mirrored on data.forgejo.org (measured -- "remote: Not
# found" cloning it), same class of gap as github/codeql-action. With only two jobs left, an
# unconditional run is simpler than a path filter anyway.
#
# No actions/setup-python here either: this runner is host-mode (bare Debian 13, not a
# container), and setup-python's manifest has no matching download for it -- measured, every
# matrix leg failed identically with "The version '3.13' with architecture 'x64' was not found
# for Debian 13". uv provisions its own interpreters (astral's portable builds, a different
# source from actions/python-versions) via `--python`, which is why it is passed to both `uv
# build` and `uv venv` below instead of relying on a preinstalled/actions-provided one.
#
# Widened from upstream's `branches: [main]` to also cover this fork's release branches --
# PRs land against `airoboros/x.y` here, not `main`.
on:
  pull_request:
    branches: [ main, 'airoboros/**' ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-api-python-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || '' }}

    # enable-cache stays OFF. On this host-mode runner every matrix leg shares one uv cache
    # (/var/lib/forgejo-runner/.cache/uv), and enable-cache's post-step runs
    # `uv cache prune --ci --force` -- --force skips uv's cache lock, so a leg that finishes
    # first deletes the extraction temp dir of a leg still installing. Measured on PR #13:
    # the 3.11 leg pruned at 18:17:29.50 and the 3.12 leg failed 0.1 s later with "Failed to
    # extract archive ... aiohttp ... No such file or directory". It bought nothing here
    # either: the GitHub Actions cache restore it pairs with missed on every leg.
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Build hindsight-api
      working-directory: ./hindsight-api-slim
      run: uv build --python ${{ matrix.python-version }}

    # `uv build` only packages the source; it does not prove the dependency set
    # resolves or that the code imports on this interpreter. Install into a fresh
    # env and run a byte-compile + import smoke test so the matrix actually
    # exercises each Python version.
    - name: Install and smoke-test on Python ${{ matrix.python-version }}
      working-directory: ./hindsight-api-slim
      run: |
        uv venv --python ${{ matrix.python-version }} .venv-smoke
        VIRTUAL_ENV=.venv-smoke uv pip install .
        .venv-smoke/bin/python -m compileall -q hindsight_api
        .venv-smoke/bin/python -c "import hindsight_api, hindsight_api.main, hindsight_api.config; from hindsight_api.engine import memory_engine, llm_wrapper; print('import OK')"

  # Strict clippy for the two Rust crates (ClaudeCode#2195). Upstream CI has no clippy job, so this
  # is the plain `--all-targets -D warnings` form. They are two separate packages, not a workspace:
  # hindsight-cli depends on the client by path but clippy lints only the package it is run in, so
  # each is linted on its own. Toolchain, draft rule and sccache follow Forge-Tools'
  # scripts/templates/forgejo/rust.yml (host-mode runner, shared ~/.rustup: see the notes there).
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.98.1'
    # A draft waits off the runner: the queue un-drafts it at the front, and that edit runs this.
    # A red or machine-held draft waits too: its fix is gated when the queue un-drafts it at the front.
    # queue:not-admitted runs only the Admission step, so a held PR never reads green.
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'queue:not-admitted') }}
    steps:
      - name: Admission — a held PR must report not-passing, never green
        if: ${{ contains(github.event.pull_request.labels.*.name, 'queue:not-admitted') }}
        run: |
          echo "held: queue:not-admitted is attached, so this gate is suppressed and must not pass"
          exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}
      - name: Toolchain 1.98.1 with clippy (serialised)
        run: |
          mkdir -p "$HOME/.rustup"
          flock "$HOME/.rustup/.ci-install.lock" sh -c '
            if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            fi
            "$HOME/.cargo/bin/rustup" run 1.98.1 cargo clippy --version >/dev/null 2>&1 \
              || "$HOME/.cargo/bin/rustup" toolchain install 1.98.1 --profile minimal --component clippy
          '
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # sccache: a compile cache keyed on each crate's source content, shared by every Rust gate on
      # this runner. Not a shared target/ (a stale-code false green, 2026-09-15): each job keeps its own target/ and its own server,
      # and an entry is only reused when the inputs hash the same. SCCACHE_BASEDIRS strips this job's
      # random workspace path so dependencies hit across jobs; workspace crates still hash their
      # absolute paths, so the PR's own code always rebuilds (proved 2026-10-21: a fault in a cached
      # crate still failed). 4G cap: the runner's disk is near full.
      - name: sccache (serialised install)
        run: |
          S="$HOME/.cache/sccache-0.18.0"; mkdir -p "$HOME/.rustup" "$S"
          flock "$HOME/.rustup/.ci-install.lock" sh -euc '
            [ -x "$0/sccache" ] && exit 0
            curl -fsSL -o "$0.tgz" https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz
            printf "%s  %s\n" 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 "$0.tgz" | sha256sum -c --quiet
            tar xzf "$0.tgz" -C "$0" --strip-components=1 sccache-v0.18.0-x86_64-unknown-linux-musl/sccache
            rm "$0.tgz"
          ' "$S"
          { echo "RUSTC_WRAPPER=$S/sccache"; echo "SCCACHE_DIR=$HOME/.cache/sccache"; echo "SCCACHE_CACHE_SIZE=4G"
            echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE"; echo "SCCACHE_SERVER_UDS=$(mktemp -u /tmp/sccache-XXXXXXXX.sock)"
            echo "CARGO_INCREMENTAL=0"; } >> "$GITHUB_ENV"
      - name: clippy hindsight-client
        working-directory: hindsight-clients/rust
        run: cargo clippy --all-targets --locked -- -D warnings
      # No --locked: upstream gitignores this crate's Cargo.lock, and --locked refuses to create one.
      - name: clippy hindsight-cli
        working-directory: hindsight-cli
        run: cargo clippy --all-targets -- -D warnings
      # The hit rate goes in the log, and the job's server does not outlive it. Never fails: a cancelled
      # job's server is already dead, and a failing stop turned that cancellation into a red (cmux job 36085).
      - name: sccache stats, stop
        if: always()
        run: '[ -z "${RUSTC_WRAPPER:-}" ] || { "$RUSTC_WRAPPER" --show-stats; "$RUSTC_WRAPPER" --stop-server; } || true'
