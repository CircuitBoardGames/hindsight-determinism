name: CI

# Forgejo-only slim CI for this fork's Claude Code plugin branch (airoboros/claude-code-plugin).
# Without it a PR here registers ZERO checks, and the queue refuses to land a commit with none --
# so plugin changes could only land by bypassing the gate. This is upstream's own
# `test-claude-code-integration` job (.github/workflows/test.yml), adapted the way the release
# branches' .forgejo/workflows/test.yml was (hub#1029): Forgejo reads ONLY .forgejo/workflows/
# once it exists, there is no dorny/paths-filter mirror, and the host-mode runner has no
# setup-python download for Debian 13, so uv provisions the interpreter.
#
# HOME is a fresh temp dir: the runner is host-mode on the box that runs the real plugin, and one
# test (test_hooks.py::test_disabled_auto_recall_produces_no_output) otherwise reads the live
# ~/.hindsight/claude-code.json and recalls from the live bank.
on:
  pull_request:
    branches: [ 'airoboros/claude-code-plugin' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-claude-code-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || '' }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Run tests
      working-directory: ./hindsight-integrations/claude-code
      run: |
        export HOME="$(mktemp -d)"
        uv run --no-project --python 3.11 --with pytest python -m pytest tests/ -q
