name: CI

# Forgejo-only slim copy of .github/workflows/test.yml (hub#1029). The upstream file is a
# 5000+ line monorepo CI matrix covering dozens of integrations, several needing secrets this
# runner does not have (GCP/Vertex, etc). Once this file exists, Forgejo reads ONLY
# .forgejo/workflows/ and ignores .github/workflows/ entirely (see
# wiki-vault/wiki/gotchas -- ".forgejo/workflows/ SHADOWS .github/workflows/"), so this carries
# just the one job relevant to changes made on this fork's release branches: the core Python
# package build/smoke-test that covers hindsight-api-slim, which is what the determinism fixes
# touch. Everything else in the upstream file runs on GitHub only, unaffected by this.
#
# No dorny/paths-filter here: it is not mirrored on data.forgejo.org (measured -- "remote: Not
# found" cloning it), same class of gap as github/codeql-action. With only one job left, an
# unconditional run is simpler than a path filter anyway.
#
# No actions/setup-python here either: this runner is host-mode (bare Debian 13, not a
# container), and setup-python's manifest has no matching download for it -- measured, every
# matrix leg failed identically with "The version '3.13' with architecture 'x64' was not found
# for Debian 13". uv provisions its own interpreters (astral's portable builds, a different
# source from actions/python-versions) via `--python`, which is why it is passed to both `uv
# build` and `uv venv` below instead of relying on a preinstalled/actions-provided one.
#
# Widened from upstream's `branches: [main]` to also cover this fork's release branches --
# PRs land against `airoboros/x.y` here, not `main`.
on:
  pull_request:
    branches: [ main, 'airoboros/**' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-api-python-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || '' }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Build hindsight-api
      working-directory: ./hindsight-api-slim
      run: uv build --python ${{ matrix.python-version }}

    # `uv build` only packages the source; it does not prove the dependency set
    # resolves or that the code imports on this interpreter. Install into a fresh
    # env and run a byte-compile + import smoke test so the matrix actually
    # exercises each Python version.
    - name: Install and smoke-test on Python ${{ matrix.python-version }}
      working-directory: ./hindsight-api-slim
      run: |
        uv venv --python ${{ matrix.python-version }} .venv-smoke
        VIRTUAL_ENV=.venv-smoke uv pip install .
        .venv-smoke/bin/python -m compileall -q hindsight_api
        .venv-smoke/bin/python -c "import hindsight_api, hindsight_api.main, hindsight_api.config; from hindsight_api.engine import memory_engine, llm_wrapper; print('import OK')"
