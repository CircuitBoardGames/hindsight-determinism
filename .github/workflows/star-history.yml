name: Update star history

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    # Upstream's daily star-history commit. On a fork it pushed a bot commit onto the release
    # branch every day (2026-09-28: 178895e9 on GitHub, ahead of the hub's tip), so the mirror
    # and the fork diverged daily. Runs only in the upstream repository.
    if: github.repository == 'vectorize-io/hindsight'
    concurrency:
      group: star-history
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nicoloboschi/gh-stars@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          line-color: '#14b8a6'
      - name: Commit chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/star-history/data.json .github/star-history/chart.svg
          git diff --cached --quiet || git commit -m 'chore: update star history'
          git push
